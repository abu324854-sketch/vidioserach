<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Qidiruv va Yuklovchi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            color: #1c1e21;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 24px;
            color: #0d6efd;
            text-align: center;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #495057;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #0d6efd;
        }

        button {
            padding: 12px 20px;
            background-color: #0d6efd;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0b5ed7;
        }

        /* Drag & Drop Fayl Zonasi */
        .drop-zone {
            border: 2px dashed #0d6efd;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            background: #f8faff;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background 0.2s;
        }

        .drop-zone:hover {
            background: #e7f1ff;
        }

        .drop-zone p {
            color: #6c757d;
            font-size: 14px;
            margin-top: 8px;
        }

        input[type="file"] {
            display: none;
        }

        /* Video Pleyer Zonasi */
        .video-container {
            margin-top: 20px;
            display: none;
            text-align: center;
        }

        video {
            width: 100%;
            border-radius: 10px;
            background: #000;
            max-height: 350px;
        }

        .download-btn {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 20px;
            background-color: #198754;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }

        .download-btn:hover {
            background-color: #157347;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h1>🎬 Video Qidiruv va Yuklash</h1>

        <!-- 1. Ssilka orqali yuklash / ko'rish -->
        <div class="section-title">1. Internet yoki tarmoqlardan havola (link) orqali:</div>
        <div class="input-group">
            <input type="text" id="videoUrlInput" placeholder="Video havolasini kiriting (https://...)">
            <button onclick="loadFromUrl()">Ochish</button>
        </div>

        <!-- 2. Kompyuter/Telefondan fayl yuklash -->
        <div class="section-title">2. Qurilmangizdan video fayl tanlang:</div>
        <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
            <span style="font-size: 32px;">📁</span>
            <p>Videoni shu yerga tashlang yoki fayl tanlash uchun bosing</p>
            <input type="file" id="fileInput" accept="video/*" onchange="handleFileSelect(event)">
        </div>

        <!-- Video pleyer va yuklash tugmasi -->
        <div class="video-container" id="videoContainer">
            <div class="section-title">Video tomosha va yuklab olish:</div>
            <video id="videoPlayer" controls></video>
            <br>
            <a id="downloadLink" class="download-btn" download="video.mp4">Videoni saqlash (Download)</a>
        </div>
    </div>

    <script>
        const videoContainer = document.getElementById('videoContainer');
        const videoPlayer = document.getElementById('videoPlayer');
        const downloadLink = document.getElementById('downloadLink');

        // 1. Ssilka (URL) orqali yuklash va pleyerga qo'yish
        function loadFromUrl() {
            const url = document.getElementById('videoUrlInput').value.trim();
            if (!url) {
                alert("Iltimos, haqiqiy video havolasini kiriting!");
                return;
            }

            videoPlayer.src = url;
            downloadLink.href = url;
            downloadLink.target = "_blank";
            videoContainer.style.display = "block";
            videoPlayer.play();
        }

        // 2. Qurilma ichidagi faylni tanlash va ijro etish
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                videoPlayer.src = fileURL;
                downloadLink.href = fileURL;
                downloadLink.download = file.name;
                videoContainer.style.display = "block";
                videoPlayer.play();
            }
        }

        // Drag & Drop hodisalari
        const dropZone = document.querySelector('.drop-zone');
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.background = '#e7f1ff';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.background = '#f8faff';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.background = '#f8faff';
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].type.startsWith('video/')) {
                document.getElementById('fileInput').files = files;
                handleFileSelect({ target: { files: files } });
            }
        });
    </script>

</body>
</html>
