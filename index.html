<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tezkor Video Matn Qidiruvi Pro</title>
    <!-- Tesseract.js (Ekrondagi matnlar uchun) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --primary: #3b82f6;
            --accent: #10b981;
            --input-bg: #0f172a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { max-width: 850px; width: 100%; display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        
        h1 { font-size: 20px; color: var(--primary); margin-bottom: 16px; text-align: center; }
        
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        input[type="text"] { flex: 1; padding: 12px; background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-main); border-radius: 8px; outline: none; font-size: 15px; }
        input[type="text"]:focus { border-color: var(--primary); }
        
        .btn { padding: 12px 20px; border-radius: 8px; font-weight: 600; border: none; cursor: pointer; background: var(--primary); color: #fff; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }

        .drop-zone { border: 2px dashed var(--card-border); border-radius: 12px; padding: 20px; text-align: center; background: rgba(255,255,255,0.02); cursor: pointer; font-size: 14px; }
        
        .video-wrapper { display: none; margin-top: 20px; }
        video { width: 100%; border-radius: 10px; background: #000; max-height: 360px; }

        .status-box { margin-top: 12px; padding: 10px; background: rgba(59, 130, 246, 0.1); border-radius: 6px; font-size: 13px; color: var(--primary); text-align: center; display: none; }

        .results-list { margin-top: 12px; max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .result-item { padding: 10px 14px; background: var(--input-bg); border-left: 4px solid var(--primary); border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .result-item:hover { background: rgba(59, 130, 246, 0.15); }
        .badge { background: var(--accent); color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="card">
        <h1>⚡ Tezkor Video Matn Qidiruvi (Srazi Topish)</h1>

        <!-- 1. URL -->
        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Video havolasini kiriting (https://...)">
            <button class="btn" onclick="loadUrl()">Yuklash</button>
        </div>

        <!-- 2. Fayl -->
        <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
            📁 Videoni shu yerga tashlang yoki tanlash uchun bosing
            <input type="file" id="fileInput" accept="video/*" style="display:none" onchange="loadFile(event)">
        </div>

        <!-- Subtitr (ixtiyoriy, tezlik uchun) -->
        <div style="margin-top: 10px; font-size: 12px; color: var(--text-sub);">
            💡 Agar bo'lsa, subtitr (.srt / .vtt) faylini ham qo'shishingiz mumkin:
            <input type="file" id="subInput" accept=".vtt,.srt" onchange="loadSubtitles(event)" style="margin-top: 4px; display: block;">
        </div>

        <!-- Video Player va Qidiruv -->
        <div class="video-wrapper" id="videoWrapper">
            <video id="player" controls crossorigin="anonymous"></video>

            <div class="status-box" id="statusBox">⏳ Video tahlil qilinmoqda...</div>

            <!-- Darhol qidirish satri -->
            <div class="input-group" style="margin-top: 15px;">
                <input type="text" id="searchKeyword" placeholder="Qidirmoqchi bo'lgan so'zingizni yozing (Srazi topadi)..." oninput="instantSearch()">
            </div>

            <!-- Natijalar -->
            <div class="results-list" id="resultsList"></div>
        </div>
    </div>
</div>

<canvas id="scanCanvas" style="display:none;"></canvas>

<script>
    const player = document.getElementById('player');
    const videoWrapper = document.getElementById('videoWrapper');
    const resultsList = document.getElementById('resultsList');
    const statusBox = document.getElementById('statusBox');
    const scanCanvas = document.getElementById('scanCanvas');
    
    let masterIndex = []; // Videodagi barcha vaqtlar va ularga mos matnlar bazasi
    let subtitles = [];

    function loadFile(e) {
        const file = e.target.files[0];
        if (file) {
            player.src = URL.createObjectURL(file);
            videoWrapper.style.display = 'block';
            analyzeVideo();
        }
    }

    function loadUrl() {
        const url = document.getElementById('videoUrl').value.trim();
        if (url) {
            player.src = url;
            videoWrapper.style.display = 'block';
            analyzeVideo();
        }
    }

    function loadSubtitles(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
            parseSRT(evt.target.result);
            alert("Subtitrlar muvaffaqiyatli qo'shildi!");
        };
        reader.readAsText(file);
    }

    function parseSRT(data) {
        subtitles = [];
        const blocks = data.split(/\n\s*\n/);
        blocks.forEach(block => {
            const lines = block.trim().split('\n');
            if (lines.length >= 2) {
                const timeLine = lines.find(l => l.includes('-->'));
                const textLines = lines.slice(lines.indexOf(timeLine) + 1).join(' ');
                if (timeLine) {
                    const [start] = timeLine.split('-->');
                    const sec = timeToSeconds(start.trim());
                    subtitles.push({ time: sec, text: textLines.toLowerCase() });
                    masterIndex.push({ time: sec, text: textLines.toLowerCase(), type: '💬 Nutq' });
                }
            }
        });
    }

    function timeToSeconds(timeStr) {
        const parts = timeStr.replace(',', '.').split(':');
        return parts.length === 3 ? parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2]) : 0;
    }

    function formatTime(sec) {
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // Videoni yuklaganda bir marta fonda skanerlab bazani shakllantirish
    async function analyzeVideo() {
        statusBox.style.display = 'block';
        statusBox.textContent = "⚡ Video kadr va matnlari xotiraga yig'ilmoqda (kuting)...";
        
        masterIndex = [...subtitles]; // Oldin subtitrlarni qo'shamiz

        const duration = player.duration || 30;
        const step = 4; // Har 4 soniyada bir kadrni skanerlash
        const ctx = scanCanvas.getContext('2d');
        scanCanvas.width = 480;
        scanCanvas.height = 270;

        const originalTime = player.currentTime;

        for (let time = 0; time < duration; time += step) {
            player.currentTime = time;
            await new Promise(r => setTimeout(r, 120));

            ctx.drawImage(player, 0, 0, scanCanvas.width, scanCanvas.height);
            try {
                const result = await Tesseract.recognize(scanCanvas, 'eng+rus');
                const cleanText = result.data.text.trim().toLowerCase();
                if (cleanText.length > 2) {
                    masterIndex.push({ time: time, text: cleanText, type: '🖼️ Ekranda' });
                }
            } catch (e) {}
        }

        player.currentTime = originalTime;
        statusBox.textContent = "✅ Tayyor! Endi istalgan so'zni yozing — srazi topadi.";
        setTimeout(() => { statusBox.style.display = 'none'; }, 4000);
    }

    // Harf yozilgan zahoti (srazi) natijani chiqarish
    function instantSearch() {
        const query = document.getElementById('searchKeyword').value.toLowerCase().trim();
        resultsList.innerHTML = '';

        if (!query || query.length < 2) return;

        // Xotiradagi bazadan darhol qidirish (serverga murojaat yo'q, 0 soniya kutish)
        const matches = masterIndex.filter(item => item.text.includes(query));

        if (matches.length === 0) {
            resultsList.innerHTML = '<div class="result-item">Hech qanday natija topilmadi.</div>';
            return;
        }

        // Takroriy vaqtlarni tozalash
        const uniqueMatches = Array.from(new Set(matches.map(m => m.time)))
            .map(time => matches.find(m => m.time === time));

        uniqueMatches.forEach(m => {
            const div = document.createElement('div');
            div.className = 'result-item';
            div.innerHTML = `<span>${m.type}: "${m.text.substring(0, 45)}..."</span> <span class="badge">${formatTime(m.time)}</span>`;
            div.onclick = () => {
                player.currentTime = m.time;
                player.play();
            };
            resultsList.appendChild(div);
        });
    }
</script>

</body>
</html>
